name: Verbum
options:
  bundleIdPrefix: com.verbum
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"

targets:
  Verbum:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Verbum
    dependencies:
      - target: VerbumWidgetExtension
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verbum.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: Verbum/Verbum.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: Verbum/Resources/Info.plist
      properties:
        CFBundleName: Verbum
        CFBundleDisplayName: Verbum
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIBackgroundColor:
            red: 0.11
            green: 0.11
            blue: 0.118
            alpha: 1.0

  VerbumWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VerbumWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verbum.app.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: VerbumWidget/VerbumWidget.entitlements
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"
    info:
      path: VerbumWidget/Info.plist
      properties:
        CFBundleName: VerbumWidget
        CFBundleDisplayName: Verbum Widget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  VerbumTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VerbumTests
    dependencies:
      - target: Verbum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verbum.app.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

# Shared schemes — defined here so `xcodegen generate` reproduces them (Xcode-authored
# shared schemes would otherwise be wiped on every regeneration).
schemes:
  Verbum:
    build:
      targets:
        Verbum: all
        VerbumWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VerbumTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
