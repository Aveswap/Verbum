name: Verbum
options:
  bundleIdPrefix: com.verbum
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15"

targets:
  Verbum:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Verbum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verbum.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: Verbum/Resources/Info.plist
      properties:
        CFBundleName: Verbum
        CFBundleDisplayName: Verbum
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: ""
        NSMicrophoneUsageDescription: ""
