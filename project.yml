name: Verbum
options:
  bundleIdPrefix: com.verbum
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15"

targets:
  Verbum:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Verbum
    dependencies:
      - target: VerbumWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verbum.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: Verbum/Resources/Info.plist
      properties:
        CFBundleName: Verbum
        CFBundleDisplayName: Verbum
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIBackgroundColor:
            red: 0.11
            green: 0.11
            blue: 0.118
            alpha: 1.0
        NSMicrophoneUsageDescription: ""

  VerbumWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VerbumWidget
      - path: Verbum/Resources/words.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verbum.app.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"
    info:
      path: VerbumWidget/Info.plist
      properties:
        CFBundleName: VerbumWidget
        CFBundleDisplayName: Verbum Widget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
