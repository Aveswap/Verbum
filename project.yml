name: Verbum
options:
  bundleIdPrefix: com.verbum
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15"
  developmentLanguage: en
# UI is localized into English (base), German and Ukrainian; the active language follows the
# in-app vocabulary-language switch at runtime (see LanguageManager).
knownRegions: [en, de, uk]

# Single source of truth for the bundle-id base. The widget + test bundle ids derive from it
# below, so they STAY prefixed with the app id (Apple requires an embedded extension's id to be
# `<app id>.<suffix>`). It's configuration-scoped so the switch is AUTOMATIC — no hand-editing
# before archiving:
#   • Release/archive → `com.verbum.app` (the production App ID that owns the iCloud container
#     `iCloud.com.verbum.app`, App Group `group.com.verbum.app`, Keychain service and Game
#     Center IDs — all of which are hard-wired in the entitlements).
#   • Debug → `com.verbumtest.app` (free/dev signing).
# Never edit the bundle id only in Xcode, or the widget id drifts and the build fails with
# "Embedded binary's bundle identifier is not prefixed with the parent app's bundle identifier".
settings:
  base:
    APP_BUNDLE_ID: com.verbum.app
  configs:
    Debug:
      APP_BUNDLE_ID: com.verbumtest.app

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"

targets:
  Verbum:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Verbum
    dependencies:
      - target: VerbumWidgetExtension
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: Verbum/Verbum.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: Verbum/Resources/Info.plist
      properties:
        CFBundleName: Verbum
        CFBundleDisplayName: Verbum
        # Custom URL scheme for widget deep links (verbum://word/<uuid> → onOpenURL in VerbumApp).
        # Lives here, not in Info.plist directly, because xcodegen regenerates Info.plist.
        CFBundleURLTypes:
          - CFBundleURLName: com.verbum.app.deeplink
            CFBundleURLSchemes: [verbum]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, uk]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIBackgroundColor:
            red: 0.11
            green: 0.11
            blue: 0.118
            alpha: 1.0

  VerbumWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VerbumWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: VerbumWidget/VerbumWidget.entitlements
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"
    info:
      path: VerbumWidget/Info.plist
      properties:
        CFBundleName: VerbumWidget
        CFBundleDisplayName: Verbum Widget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  VerbumTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VerbumTests
    dependencies:
      - target: Verbum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

# Shared schemes — defined here so `xcodegen generate` reproduces them (Xcode-authored
# shared schemes would otherwise be wiped on every regeneration).
schemes:
  Verbum:
    build:
      targets:
        Verbum: all
        VerbumWidgetExtension: all
    run:
      config: Debug
      # Enables StoreKit Testing in the simulator/dev runs, so the paywall can load the
      # pro_monthly / pro_yearly / pro_lifetime products without App Store Connect.
      storeKitConfiguration: Verbum/Verbum.storekit
    test:
      config: Debug
      targets:
        - VerbumTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
