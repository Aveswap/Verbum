name: Verbum
options:
  bundleIdPrefix: com.verbum
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15"
  developmentLanguage: en
# UI is localized into English (base), German and Ukrainian; the active language follows the
# in-app vocabulary-language switch at runtime (see LanguageManager).
knownRegions: [en, de, uk]

# Single source of truth for the bundle-id base. The test bundle id derives from it below, so it
# STAYS prefixed with the app id. It's configuration-scoped so the switch is AUTOMATIC — no
# hand-editing before archiving:
#   • Release/archive → `com.verbum.app` (the production App ID; it owns the App Group
#     `group.com.verbum.app`, declared in Verbum.entitlements).
#   • Debug → `com.verbumtest.app` (free/dev signing).
# NOTE: Sign in with Apple / CloudKit / Game Center are local-dev STUBS in this cut, so their
# entitlements (applesignin, icloud-services, icloud-container-identifiers, game-center) are
# intentionally NOT in Verbum.entitlements yet — add them together with the real services when
# AppInfo.isSignInConfigured / isGameCenterConfigured flip on (see _LocalDev-Disabled/*.original).
settings:
  base:
    APP_BUNDLE_ID: com.verbum.app
  configs:
    Debug:
      APP_BUNDLE_ID: com.verbumtest.app

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.0"

targets:
  Verbum:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Verbum
    dependencies:
      - package: GRDB
        product: GRDB
      # Widget extension that hosts the word-spotlight Live Activity (Dynamic Island).
      - target: VerbumWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: Verbum/Verbum.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: Verbum/Resources/Info.plist
      properties:
        CFBundleName: Verbum
        CFBundleDisplayName: Verbum
        # Custom URL scheme for deep links (verbum://word/<uuid> → onOpenURL in VerbumApp),
        # used by notification taps and Spotlight results. Lives here, not in Info.plist
        # directly, because xcodegen regenerates Info.plist.
        CFBundleURLTypes:
          - CFBundleURLName: com.verbum.app.deeplink
            CFBundleURLSchemes: [verbum]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        # Lets the app start Live Activities (word spotlight in the Dynamic Island / Lock Screen).
        NSSupportsLiveActivities: true
        # Required because the share sheet's "Save Image" calls UIImageWriteToSavedPhotosAlbum —
        # without this string iOS crashes the app the moment the photo-add permission is requested.
        NSPhotoLibraryAddUsageDescription: "Verbum saves your word cards to your photo library so you can share them."
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, uk]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIBackgroundColor:
            red: 0.11
            green: 0.11
            blue: 0.118
            alpha: 1.0

  VerbumWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VerbumWidgets
      # Shared with the app target (which globs Verbum/) — the Live Activity payload.
      - path: Verbum/Core/LiveActivity/RushActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: VerbumWidgets/Info.plist
      properties:
        CFBundleName: VerbumWidgets
        CFBundleDisplayName: Verbum
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  VerbumTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VerbumTests
    dependencies:
      - target: Verbum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic

# Shared schemes — defined here so `xcodegen generate` reproduces them (Xcode-authored
# shared schemes would otherwise be wiped on every regeneration).
schemes:
  Verbum:
    build:
      targets:
        Verbum: all
    run:
      config: Debug
      # Enables StoreKit Testing in the simulator/dev runs, so the paywall can load the
      # pro_monthly / pro_yearly / pro_lifetime products without App Store Connect.
      storeKitConfiguration: Verbum/Verbum.storekit
    test:
      config: Debug
      targets:
        - VerbumTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
